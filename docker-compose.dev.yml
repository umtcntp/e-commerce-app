name: e-commerce-app

services:
  api:
    container_name: ecommerce-api
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file: ./backend/.env
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - e-commerce-app

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        - VITE_BACKEND_URL: https://api.auth.localhost
    restart: unless-stopped
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - e-commerce-app
    command: npm run dev -- --host
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - e-commerce-app
    depends_on:
      - api
      - frontend
      - admin

  admin:
    build:
      context: ./admin
      target: development
      args:
        - VITE_BACKEND_URL: https://api.auth.localhost
    restart: unless-stopped
    env_file: ./admin/.env
    volumes:
      - ./admin:/app
      - /app/node_modules
    networks:
      - e-commerce-app
    command: npm run dev -- --host
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
networks:
  e-commerce-app:
    driver: bridge
