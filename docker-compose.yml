name: e-commerce-app-test

services:
  api:
    container_name: api-test
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: ./backend/.env
    command: npm start
    networks:
      - proxy

  frontend:
    container_name: frontend-test
    build:
      context: ./frontend
      target: production
      args:
        VITE_BACKEND_URL: https://api.${DOMAIN_NAME}
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - api

  admin:
    container_name: admin-test
    build:
      context: ./admin
      target: production
      args:
        VITE_BACKEND_URL: https://api.${DOMAIN_NAME}
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - api

networks:
  proxy:
    external: true

